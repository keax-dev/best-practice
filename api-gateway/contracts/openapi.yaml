components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
          enum:
          - INVALID_INPUT
          - PRODUCT_NOT_FOUND
          - ORDER_NOT_FOUND
          - INSUFFICIENT_STOCK
          - IDEMPOTENCY_CONFLICT
          - SERVICE_UNAVAILABLE
          - UPSTREAM_TIMEOUT
          - INVALID_RESPONSE
          - INTERNAL_ERROR
          - UNSUPPORTED_MEDIA_TYPE
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - AUTH_REQUIRED
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          - INVALID_CREDENTIALS
          - FORBIDDEN
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
    OrderInput:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id: &id003
          type: integer
          minimum: 1
        quantity: *id003
    Order:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - quantity
      - status
      - reason
      - created_at
      - user_id
      properties:
        id:
          type: string
          format: uuid
        product_id: &id004
          type: integer
          minimum: 1
        quantity: *id004
        status:
          type: string
          enum:
          - CREADO
          - CONFIRMADO
          - CANCELADO
          - ERROR_VALIDACION
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          pattern: ^\d{4}-\d{2}-\d{2}T.*Z$
        user_id:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          description: Propietario obtenido del sub del JWT por el gateway; nunca
            se acepta en el cuerpo de creación.
    Product:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - stock
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        stock:
          type: integer
          minimum: 0
    DeductionInput:
      type: object
      additionalProperties: false
      required:
      - order_id
      - product_id
      - quantity
      properties:
        order_id:
          type: string
          format: uuid
        product_id: &id005
          type: integer
          minimum: 1
        quantity: *id005
    Deduction:
      type: object
      additionalProperties: false
      required:
      - order_id
      - product_id
      - quantity
      - remaining_stock
      properties:
        order_id:
          type: string
          format: uuid
        product_id: &id006
          type: integer
          minimum: 1
        quantity: *id006
        remaining_stock:
          type: integer
          minimum: 0
    LoginInput:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    Token:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OrdersServiceKey:
      type: apiKey
      in: header
      name: X-Orders-Service-Key
      description: Credencial exclusiva de Pedidos; solo permite POST de descuentos.
