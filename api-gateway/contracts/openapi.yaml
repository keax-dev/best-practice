  /health:
    get:
      operationId: getHealth
      summary: getHealth
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: api-gateway
        '400':
          description: Solicitud inválida
          content:
            application/json:
