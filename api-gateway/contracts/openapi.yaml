            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: No tienes permiso para esta operación
                details: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
            example:
              product_id: 1
              quantity: 2
      security:
      - BearerAuth: []
    get:
